<div class="container mt-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Gestión de Tipo de Ficha</h3>

    <button 
      class="btn btn-primary"
      (click)="abrirModalNuevo()"
      data-bs-toggle="modal"
      data-bs-target="#modalDetalle">

      <i class="bi bi-plus-lg me-2"></i>
      Agregar nuevo tipo de ficha
    </button>
  </div>

  <!-- TABLA -->
  <table class="table table-bordered text-center">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Producto</th>
        <th>Descripción</th>
        <th>Orden</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let detalle of detalles">
        <td>{{ detalle.id }}</td>
        <td>{{ detalle.producto }}</td>
        <td>{{ detalle.descripcion }}</td>
        <td>{{ detalle.order }}</td>
        <td>
          <button 
            class="btn btn-warning btn-sm me-2"
            (click)="editarDetalle(detalle)"
            data-bs-toggle="modal"
            data-bs-target="#modalDetalle">
            Editar
          </button>

          <button 
            class="btn btn-danger btn-sm"
            (click)="eliminarDetalle(detalle.id)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>

<!-- MODAL -->
<div 
  class="modal fade" 
  id="modalDetalle" 
  tabindex="-1">

  <div class="modal-dialog">
    <div class="modal-content">

      <!-- HEADER -->
      <div class="modal-header">
        <h5 class="modal-title">
          {{ editando ? 'Editar Documento' : 'Nuevo Documento' }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- BODY -->
      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <input 
            type="text" 
            class="form-control"
            [(ngModel)]="nuevoDetalle.descripcion">
        </div>
        <div class="mb-3">
          <label class="form-label">Producto</label>
          <input 
            type="text" 
            class="form-control"
            [(ngModel)]="nuevoDetalle.producto">        
        
      </div>

      <!-- FOOTER -->
      <div class="modal-footer">
        

        <button 
          class="btn btn-success"
          (click)="guardarDetalle()"
          data-bs-dismiss="modal">

          {{ editando ? 'Actualizar' : 'Guardar' }}
        </button>
        <button 
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cancelar
        </button>
      </div>

    </div>
  </div>
</div>
